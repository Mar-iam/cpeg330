<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hash Table — Instructor Activity</title>
<style>
  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --surface2: #f0efe9;
    --border: #e2e0d8;
    --border2: #ccc9bc;
    --text: #1c1b18;
    --muted: #7a7870;
    --green-bg: #edf7ed;
    --green-border: #b2dfb2;
    --green-text: #2d6a2d;
    --orange-bg: #fff4e6;
    --orange-border: #ffd08a;
    --orange-text: #b85c00;
    --blue-bg: #eaf3ff;
    --blue-border: #aaccf5;
    --blue-text: #1a4f8c;
    --mono: 'Atkinson Hyperlegible Mono', monospace;
    --sans: 'Atkinson Hyperlegible', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1.5rem;
  }

  header {
    margin-bottom: 2rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1.25rem;
  }

  header h1 {
    font-family: var(--mono);
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  .scenario-switcher {
    display: flex;
    gap: 6px;
    margin-bottom: 1rem;
    flex-wrap: wrap;
    align-items: center;
  }

  .switcher-label {
    font-size: 0.78rem;
    font-family: var(--mono);
    color: var(--muted);
    margin-right: 4px;
  }

  .scen-btn {
    padding: 5px 14px;
    font-size: 0.78rem;
    font-family: var(--mono);
    font-weight: 500;
    border: 1px solid var(--border2);
    border-radius: 5px;
    background: var(--surface);
    cursor: pointer;
    color: var(--muted);
    transition: all .15s;
  }
  .scen-btn:hover { background: var(--surface2); color: var(--text); }
  .scen-btn.active { background: var(--text); color: #fff; border-color: var(--text); }

  .scenario {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .scenario strong {
    font-family: var(--mono);
    font-size: 0.82rem;
    color: var(--text);
    font-weight: 700;
  }

  .scenario .sep { color: var(--border2); }

  .h2-tag {
    font-family: var(--mono);
    font-size: 0.78rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 2px 8px;
    color: var(--muted);
    display: none;
  }

  .strategy-row {
    display: flex;
    gap: 6px;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }

  .strat-btn {
    padding: 7px 16px;
    font-size: 0.8rem;
    font-family: var(--mono);
    font-weight: 500;
    border: 1px solid var(--border2);
    border-radius: 6px;
    background: var(--surface);
    cursor: pointer;
    color: var(--muted);
    transition: all .15s;
    letter-spacing: -0.01em;
  }
  .strat-btn:hover { background: var(--surface2); color: var(--text); }
  .strat-btn.active { background: var(--text); color: #fff; border-color: var(--text); }

  .keys-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }

  .keys-label {
    font-size: 0.75rem;
    font-family: var(--mono);
    color: var(--muted);
    margin-right: 2px;
  }

  .key-pill {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1.5px solid var(--border2);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--muted);
    transition: all .25s;
  }
  .key-pill.active { border-color: var(--text); background: var(--text); color: #fff; transform: scale(1.1); }
  .key-pill.done   { border-color: var(--green-border); background: var(--green-bg); color: var(--green-text); }

  .table-grid {
    display: flex;
    gap: 5px;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
  }

  .slot {
    flex: 1;
    min-width: 46px;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: var(--surface);
    transition: border-color .2s, border-width .2s;
  }
  .slot.lit { border-color: var(--text); border-width: 1.5px; }

  .slot-idx {
    background: var(--surface2);
    font-family: var(--mono);
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--muted);
    text-align: center;
    padding: 5px 0;
    border-bottom: 1px solid var(--border);
  }

  .slot-body {
    min-height: 52px;
    padding: 5px 4px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    align-items: center;
    justify-content: center;
  }

  .empty-mark { font-size: 0.75rem; color: #ccc; font-family: var(--mono); }

  .cell {
    font-family: var(--mono);
    font-size: 0.78rem;
    font-weight: 700;
    padding: 3px 4px;
    border-radius: 4px;
    text-align: center;
    width: 100%;
    animation: popin .28s cubic-bezier(.34,1.56,.64,1);
  }

  @keyframes popin {
    from { transform: scale(0.4); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }

  .c-direct    { background: var(--green-bg);  color: var(--green-text);  border: 1px solid var(--green-border); }
  .c-collision { background: var(--orange-bg); color: var(--orange-text); border: 1px solid var(--orange-border); }
  .c-probe     { background: var(--blue-bg);   color: var(--blue-text);   border: 1px solid var(--blue-border); }

  .explain {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 0.83rem;
    color: var(--text);
    line-height: 1.75;
    margin-bottom: 1.25rem;
    min-height: 58px;
  }
  .explain .calc        { font-family: var(--mono); font-size: 0.78rem; background: var(--surface2); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--border); }
  .explain .direct      { color: var(--green-text);  font-weight: 500; }
  .explain .collision   { color: var(--orange-text); font-weight: 500; }
  .explain .probe       { color: var(--blue-text);   font-weight: 500; }
  .explain .placeholder { color: #bbb; font-style: italic; }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .leg { display: flex; align-items: center; gap: 5px; font-size: 0.75rem; color: var(--muted); }
  .leg-dot { width: 11px; height: 11px; border-radius: 3px; }

  .ctrl-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .btn {
    padding: 8px 20px;
    font-size: 0.83rem;
    font-family: var(--mono);
    font-weight: 500;
    border: 1px solid var(--border2);
    border-radius: 7px;
    background: var(--surface);
    cursor: pointer;
    color: var(--text);
    transition: background .12s;
    letter-spacing: -0.01em;
  }
  .btn:hover { background: var(--surface2); }
  .btn.primary { background: var(--text); color: #fff; border-color: var(--text); }
  .btn.primary:hover { background: #333; }
  .btn:disabled { opacity: .3; cursor: default; pointer-events: none; }

  .step-count { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); margin-left: 2px; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root,:root[data-theme]{--bg:#F6F6F3!important;--surface:#FFFFFF!important;--surface2:#F0F0EC!important;--border:#E3E3DD!important;--border2:#D2D2CA!important;--text:#1B1B1F!important;--muted:#6B6B73!important;}
html{color-scheme:light}
body{background:var(--bg)!important;color:var(--text);-webkit-font-smoothing:antialiased;padding-bottom:56px}
button:focus-visible,input:focus-visible{outline:2px solid #274C77;outline-offset:2px}
header h1{font-family:'Atkinson Hyperlegible',sans-serif!important;font-size:1.35rem!important;letter-spacing:-.02em!important}
.hash-cnt{border:1px solid var(--border);border-radius:8px;margin-bottom:1.25rem}
/* Shared classroom toolkit styles */
html.dsv-proj body{zoom:1.3}
.dsv-bar{position:fixed;right:14px;bottom:14px;z-index:900;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 28px)}
.dsv-tool{font:inherit;font-size:12.5px;padding:6px 11px;border-radius:999px;border:1px solid var(--border2,#D2D2CA);background:var(--surface,#fff);color:var(--text,#1B1B1F);cursor:pointer;box-shadow:0 2px 8px rgba(27,27,31,.08)}
.dsv-tool b{font-weight:700;margin-left:3px;color:var(--muted,#6B6B73)}
.dsv-tool[aria-pressed="true"]{background:#274C77;border-color:#274C77;color:#fff}
.dsv-tool[aria-pressed="true"] b{color:#fff}
.dsv-tool:hover{border-color:#274C77}
.dsv-tool:focus-visible,.dsv-opt:focus-visible,.dsv-go:focus-visible,.dsv-skip:focus-visible{outline:2px solid #274C77;outline-offset:2px}
.dsv-help{position:absolute;right:0;bottom:calc(100% + 8px);background:var(--surface,#fff);border:1px solid var(--border,#E3E3DD);border-radius:8px;padding:10px 14px;font-size:13px;line-height:1.9;box-shadow:0 8px 24px rgba(27,27,31,.12);white-space:nowrap;color:var(--text,#1B1B1F)}
.dsv-help kbd{display:inline-block;min-width:22px;text-align:center;font:inherit;font-size:12px;padding:0 5px;margin-right:6px;border:1px solid var(--border2,#D2D2CA);border-bottom-width:2px;border-radius:4px;background:var(--surface2,#F0F0EC)}

.dsv-active{outline:2px solid #274C77!important;outline-offset:2px}
.dsv-cnt{display:flex;gap:18px;flex-wrap:wrap;padding:7px 14px;border-bottom:1px solid var(--border,#E3E3DD);font-size:12.5px;color:var(--muted,#6B6B73);background:var(--surface,#fff)}
.dsv-cnt b{color:var(--text,#1B1B1F);font-variant-numeric:tabular-nums;font-size:14px;margin-left:5px}

.dsv-modal{position:fixed;inset:0;z-index:1000;background:rgba(27,27,31,.32);display:flex;align-items:center;justify-content:center;padding:16px}
.dsv-modal[hidden]{display:none}
.dsv-card{background:var(--surface,#fff);color:var(--text,#1B1B1F);border-radius:12px;max-width:520px;width:100%;padding:22px 22px 18px;box-shadow:0 18px 50px rgba(27,27,31,.25)}
.dsv-label{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#274C77;margin-bottom:8px}
.dsv-q{font-size:18px;line-height:1.45;margin-bottom:16px}
.dsv-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.dsv-opt{font:inherit;font-size:15px;text-align:left;padding:10px 12px;border-radius:8px;border:1.5px solid var(--border2,#D2D2CA);background:var(--surface,#fff);color:var(--text,#1B1B1F);cursor:pointer;display:flex;align-items:center;gap:10px}
.dsv-opt:hover:not(:disabled){border-color:#274C77}
.dsv-opt:disabled{cursor:default;opacity:.55}
.dsv-opt.ok{opacity:1;border-color:#15803D;background:#ECFDF3}
.dsv-opt.no{opacity:1;border-color:#B91C1C;background:#FEF2F2}
.dsv-n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--surface2,#F0F0EC);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.dsv-fb{min-height:24px;margin:14px 0 4px;font-size:14.5px;line-height:1.5}
.dsv-fb .good{color:#15803D;font-weight:700}
.dsv-fb .bad{color:#B91C1C;font-weight:700}
.dsv-foot{display:flex;justify-content:space-between;gap:8px;margin-top:10px}
.dsv-skip{font:inherit;font-size:13.5px;background:none;border:0;color:var(--muted,#6B6B73);cursor:pointer;padding:8px 4px;text-decoration:underline}
.dsv-skip[hidden]{display:none}
.dsv-go{font:inherit;font-size:14px;font-weight:700;margin-left:auto;padding:9px 16px;border-radius:8px;border:0;background:#274C77;color:#fff;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.dsv-card{animation:dsvIn .16s ease-out}@keyframes dsvIn{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}}

</style>

<body>

<header>
  <h1>Hash Table Activity</h1>
</header>

<div class="scenario-switcher">
  <span class="switcher-label">scenario:</span>
  <button class="scen-btn active" onclick="setScenario(0,this)">A &mdash; N=7, k mod 7</button>
  <button class="scen-btn" onclick="setScenario(1,this)">B &mdash; N=11, k mod 11</button>
</div>

<div class="scenario">
  <span>Keys (in order):</span>
  <strong id="sc-keys"></strong>
  <span class="sep">/</span>
  <span id="sc-size"></span>
  <span class="sep">/</span>
  <strong id="sc-h1"></strong>
  <span class="h2-tag" id="h2tag"></span>
</div>

<div class="strategy-row">
  <button class="strat-btn active" onclick="setStrategy('chain',this)">Chaining</button>
  <button class="strat-btn" onclick="setStrategy('linear',this)">Linear probing</button>
  <button class="strat-btn" onclick="setStrategy('double',this)">Double hashing</button>
</div>

<div class="keys-row" id="keys-row">
  <span class="keys-label">keys &rarr;</span>
</div>

<div class="table-grid" id="tgrid"></div>

<div class="explain" id="explain"><span class="placeholder">Press Next to insert the first key.</span></div>

<div style="display:flex;align-items:center;gap:10px;margin-bottom:1.25rem;">
  <span style="font-family:var(--mono);font-size:0.78rem;color:var(--muted);">&lambda; (load factor)</span>
  <div style="flex:1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;border:0.5px solid var(--border);">
    <div id="lf-bar" style="height:100%;width:0%;background:#1c1b18;border-radius:3px;transition:width .4s;"></div>
  </div>
  <span style="font-family:var(--mono);font-size:0.82rem;font-weight:700;color:var(--text);min-width:110px;" id="lf-label">0 / 0 = 0.00</span>
</div>
<div class="legend">
  <div class="leg"><div class="leg-dot" style="background:var(--green-bg);border:1px solid var(--green-border)"></div>Direct placement</div>
  <div class="leg"><div class="leg-dot" style="background:var(--orange-bg);border:1px solid var(--orange-border)"></div>Collision / chained</div>
  <div class="leg" id="probe-leg" style="display:none"><div class="leg-dot" style="background:var(--blue-bg);border:1px solid var(--blue-border)"></div>Probed placement</div>
</div>

<div class="ctrl-row">
  <button class="btn" onclick="reset()">↺ Reset</button>
  <button class="btn" id="btn-prev" onclick="prevStep()" disabled>← Prev</button>
  <button class="btn primary" id="btn-next" onclick="nextGated()">Next →</button>
  <button class="btn" id="btn-auto" onclick="toggleAuto()">▶ Auto</button>
  <span class="step-count" id="sc-counter">0 / 0</span>
</div>

<script>
const SCENARIOS = [
  {
    keys: [10,22,31,4,15,32,17],
    N: 7,
    h1Label: 'h(k) = k mod 7',
    h2Label: 'h2(k) = 3 + (k mod 4)',
    h1: k => k % 7,
    h2: k => 3 + (k % 4),
    h1Str: (k,r) => k+' mod 7 = '+r,
    h2Str: (k,r,s2) => 'h1='+r+', h2=3+('+k+' mod 4)='+s2
  },
  {
    keys: [14,25,7,40,18,52,6,31,63],
    N: 11,
    h1Label: 'h(k) = k mod 11',
    h2Label: 'h2(k) = 1 + (k mod 7)',
    h1: k => k % 11,
    h2: k => 1 + (k % 7),
    h1Str: (k,r) => k+' mod 11 = '+r,
    h2Str: (k,r,s2) => 'h1='+r+', h2=1+('+k+' mod 7)='+s2
  }
];

let SC = SCENARIOS[0];
let strategy = 'chain';
let step = 0;
let table = [];

function initTable(){ table = Array.from({length:SC.N}, ()=>[]); }

function buildKeyPills(){
  const row = document.getElementById('keys-row');
  row.innerHTML = '<span class="keys-label">keys \u2192</span>';
  SC.keys.forEach((k,i)=>{
    const d = document.createElement('div');
    d.className = 'key-pill';
    d.id = 'kp'+i;
    d.textContent = k;
    row.appendChild(d);
  });
}

function renderTable(){
  const g = document.getElementById('tgrid');
  g.innerHTML = '';
  for(let i=0;i<SC.N;i++){
    const s = document.createElement('div');
    s.className = 'slot';
    s.id = 'sl'+i;
    const body = table[i].length === 0
      ? '<span class="empty-mark">\u2014</span>'
      : table[i].map(c=>'<div class="cell '+c.cls+'">'+c.key+'</div>').join('');
    s.innerHTML = '<div class="slot-idx">'+i+'</div><div class="slot-body" id="sb'+i+'">'+body+'</div>';
    g.appendChild(s);
  }
}

function light(idx){
  for(let i=0;i<SC.N;i++){
    const el=document.getElementById('sl'+i);
    if(el) el.classList.remove('lit');
  }
  if(idx>=0){ const el=document.getElementById('sl'+idx); if(el) el.classList.add('lit'); }
}

function next(){
  if(step >= SC.keys.length) return;
  const k = SC.keys[step];
  const i0 = SC.h1(k);
  let placed, msg, cls;

  if(strategy === 'chain'){
    const col = table[i0].length > 0;
    cls = col ? 'c-collision' : 'c-direct';
    table[i0].unshift({key:k, cls});
    placed = i0;
    if(col){
      const rest = table[i0].slice(1).map(x=>x.key).join(' → ');
      msg = 'Insert <strong>'+k+'</strong>: <span class="calc">'+SC.h1Str(k,i0)+'</span> &rarr; slot '+i0+' has ['+rest+'] &rarr; <span class="collision">collision &mdash; prepended to head. Chain is now: '+k+' → '+rest+'.</span>';
    } else {
      msg = 'Insert <strong>'+k+'</strong>: <span class="calc">'+SC.h1Str(k,i0)+'</span> &rarr; slot '+i0+' is empty &rarr; <span class="direct">placed at head of new chain at slot '+i0+'.</span>';
    }
  }

  else if(strategy === 'linear'){
    let p=i0, c=0, taken=[];
    while(table[p].length>0){ taken.push(p); p=(p+1)%SC.N; c++; }
    cls = c===0 ? 'c-direct' : 'c-probe';
    table[p].push({key:k, cls});
    placed = p;
    if(c===0){
      msg = 'Insert <strong>'+k+'</strong>: <span class="calc">'+SC.h1Str(k,i0)+'</span> &rarr; slot '+i0+' is empty &rarr; <span class="direct">placed directly at slot '+i0+'.</span>';
    } else {
      let seq = taken.map(s=>'slot '+s+' (taken)').join(' → ')+' → slot '+p+' (empty ✓)';
      msg = 'Insert <strong>'+k+'</strong>: <span class="calc">'+SC.h1Str(k,i0)+'</span> &rarr; '+seq+' &rarr; <span class="probe">placed at slot '+p+' after '+c+' probe'+(c>1?'s':'')+'.</span>';
    }
  }

  else {
    const s2 = SC.h2(k);
    let c=0, probes=[];
    let p=i0;
    while(table[p].length>0){
      c++;
      let next=((i0+c*s2)%SC.N+SC.N)%SC.N;
      probes.push({i:c, slot:next, taken: table[next].length>0 });
      p=next;
    }
    cls = c===0 ? 'c-direct' : 'c-probe';
    table[p].push({key:k, cls});
    placed = p;
    if(c===0){
      msg = 'Insert <strong>'+k+'</strong>: <span class="calc">'+SC.h2Str(k,i0,s2)+'</span> &rarr; slot '+i0+' is empty &rarr; <span class="direct">placed directly at slot '+i0+'.</span>';
    } else {
      let seq = probes.map(pr=>'slot '+pr.slot+' [('+i0+'+'+pr.i+'×'+s2+') mod '+SC.N+'='+pr.slot+']'+(pr.taken?' (taken)':' (empty ✓)')).join(' → ');
      msg = 'Insert <strong>'+k+'</strong>: <span class="calc">'+SC.h2Str(k,i0,s2)+'</span> &rarr; '+seq+' &rarr; <span class="probe">placed at slot '+p+' after '+c+' probe'+(c>1?'s':'')+'.</span>';
    }
  }

  renderTable();
  light(placed);
  const newCell = document.querySelector('#sb'+placed+' .cell:last-child');
  if(newCell){ newCell.style.animation='none'; newCell.offsetHeight; newCell.style.animation=''; }

  document.getElementById('explain').innerHTML = msg;
  document.getElementById('kp'+step).classList.remove('active');
  document.getElementById('kp'+step).classList.add('done');
  step++;
  document.getElementById('sc-counter').textContent = step+' / '+SC.keys.length;
  var lf = step/SC.N;
  document.getElementById('lf-bar').style.width = Math.min(lf*100,100).toFixed(1)+'%';
  document.getElementById('lf-label').textContent = step+' / '+SC.N+' = '+lf.toFixed(2);
  document.getElementById('lf-bar').style.background = lf>0.7?'#b85c00':lf>0.5?'#ba7517':'#1c1b18';
  if(step < SC.keys.length) document.getElementById('kp'+step).classList.add('active');
  else { document.getElementById('btn-next').disabled=true; light(-1); }
}

function reset(){
  step=0; initTable(); renderTable();
  SC.keys.forEach((_,i)=>{
    const p=document.getElementById('kp'+i);
    if(p) p.classList.remove('active','done');
  });
  document.getElementById('explain').innerHTML='<span class="placeholder">Press Next to insert the first key.</span>';
  document.getElementById('btn-next').disabled=false;
  document.getElementById('sc-counter').textContent='0 / '+SC.keys.length;
  document.getElementById('lf-bar').style.width='0%';
  document.getElementById('lf-bar').style.background='#1c1b18';
  document.getElementById('lf-label').textContent='0 / '+SC.N+' = 0.00';
  light(-1);
}

function updateScenarioUI(){
  document.getElementById('sc-keys').textContent = SC.keys.join(', ');
  document.getElementById('sc-size').textContent = 'N = '+SC.N;
  document.getElementById('sc-h1').textContent = SC.h1Label;
  document.getElementById('h2tag').textContent = SC.h2Label;
  document.getElementById('h2tag').style.display = strategy==='double' ? 'inline' : 'none';
}

function setScenario(idx, btn){
  SC = SCENARIOS[idx];
  document.querySelectorAll('.scen-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  updateScenarioUI();
  buildKeyPills();
  reset();
}

function setStrategy(s,btn){
  strategy=s;
  document.querySelectorAll('.strat-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('probe-leg').style.display = s==='chain' ? 'none' : 'flex';
  document.getElementById('h2tag').style.display = s==='double' ? 'inline' : 'none';
  reset();
}

updateScenarioUI();
buildKeyPills();
initTable();
renderTable();
</script>
<script>
/* Shared classroom toolkit: predict mode, keyboard control, projector mode */
window.DSV = (function () {
  var KEY = 'cpeg330-prefs';
  var prefs = { predict: false, projector: false };
  try { var saved = JSON.parse(localStorage.getItem(KEY) || '{}'); if (saved) { prefs.predict = !!saved.predict; prefs.projector = !!saved.projector; } } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(prefs)); } catch (e) {} }

  var opts = { predict: true };
  var panels = [], active = 0;
  var modal = null, pending = null, answered = false, current = null;

  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

  function applyPrefs() {
    document.documentElement.classList.toggle('dsv-proj', prefs.projector);
    var bp = document.getElementById('dsv-predict'), bj = document.getElementById('dsv-proj');
    if (bp) { bp.setAttribute('aria-pressed', prefs.predict); bp.querySelector('b').textContent = prefs.predict ? 'On' : 'Off'; }
    if (bj) { bj.setAttribute('aria-pressed', prefs.projector); bj.querySelector('b').textContent = prefs.projector ? 'On' : 'Off'; }
  }

  function buildBar() {
    var bar = el('div', 'dsv-bar');
    bar.setAttribute('role', 'toolbar'); bar.setAttribute('aria-label', 'Classroom tools');
    if (opts.predict) {
      var p = el('button', 'dsv-tool', 'Predict mode <b>Off</b>');
      p.id = 'dsv-predict'; p.type = 'button'; p.title = 'Pause before each step and ask the class what happens next (P)';
      p.onclick = function () { prefs.predict = !prefs.predict; save(); applyPrefs(); };
      bar.appendChild(p);
    }
    var j = el('button', 'dsv-tool', 'Projector <b>Off</b>');
    j.id = 'dsv-proj'; j.type = 'button'; j.title = 'Enlarge everything for the back row (F)';
    j.onclick = function () { prefs.projector = !prefs.projector; save(); applyPrefs(); };
    bar.appendChild(j);
    var k = el('button', 'dsv-tool dsv-keys', 'Keys');
    k.type = 'button'; k.setAttribute('aria-expanded', 'false');
    var help = el('div', 'dsv-help');
    help.hidden = true;
    help.innerHTML = opts.keysHelp || (
      '<div><kbd>→</kbd> Next step</div><div><kbd>←</kbd> Previous step</div>' +
      '<div><kbd>Space</kbd> Auto play / pause</div><div><kbd>R</kbd> Reset</div>' +
      (opts.multi ? '<div><kbd>1</kbd>–<kbd>' + opts.multi + '</kbd> Choose panel</div>' : '') +
      (opts.predict ? '<div><kbd>P</kbd> Predict mode</div>' : '') +
      '<div><kbd>F</kbd> Projector mode</div>');
    k.onclick = function () { help.hidden = !help.hidden; k.setAttribute('aria-expanded', String(!help.hidden)); };
    bar.appendChild(k); bar.appendChild(help);
    document.body.appendChild(bar);
    applyPrefs();
  }

  function setActive(i) {
    if (!panels[i]) return;
    active = i;
    panels.forEach(function (p, n) { if (p.el) p.el.classList.toggle('dsv-active', n === i && panels.length > 1); });
  }

  function register(p) {
    var i = panels.length; panels.push(p);
    if (p.el) p.el.addEventListener('pointerdown', function () { setActive(i); }, true);
    setActive(active);
  }

  /* ---------- predict modal ---------- */
  function buildModal() {
    modal = el('div', 'dsv-modal');
    modal.hidden = true;
    modal.innerHTML =
      '<div class="dsv-card" role="dialog" aria-modal="true" aria-labelledby="dsv-q">' +
      '<div class="dsv-label">Predict the next step</div>' +
      '<div class="dsv-q" id="dsv-q"></div>' +
      '<div class="dsv-opts"></div>' +
      '<div class="dsv-fb" aria-live="polite"></div>' +
      '<div class="dsv-foot"><button type="button" class="dsv-skip">Skip question</button>' +
      '<button type="button" class="dsv-go">Show the answer</button></div></div>';
    document.body.appendChild(modal);
    modal.querySelector('.dsv-skip').onclick = function () { proceed(); };
    modal.querySelector('.dsv-go').onclick = function () { if (answered) proceed(); else reveal(-1); };
    modal.addEventListener('click', function (e) { if (e.target === modal) close(); });
  }

  function ask(q, go) {
    if (!prefs.predict || !opts.predict || !q || !q.options || q.options.length < 2) { go(); return false; }
    if (!modal) buildModal();
    current = q; pending = go; answered = false;
    modal.querySelector('.dsv-q').innerHTML = q.prompt;
    var box = modal.querySelector('.dsv-opts'); box.innerHTML = '';
    q.options.forEach(function (o, i) {
      var b = el('button', 'dsv-opt', '<span class="dsv-n">' + (i + 1) + '</span>' + o);
      b.type = 'button';
      b.onclick = function () { if (!answered) reveal(i); };
      box.appendChild(b);
    });
    modal.querySelector('.dsv-fb').innerHTML = '';
    modal.querySelector('.dsv-go').textContent = 'Show the answer';
    modal.querySelector('.dsv-skip').hidden = false;
    modal.hidden = false;
    setTimeout(function () { var f = box.querySelector('button'); if (f) f.focus(); }, 0);
    return true;
  }

  function reveal(i) {
    answered = true;
    var btns = modal.querySelectorAll('.dsv-opt');
    btns.forEach(function (b, n) {
      b.disabled = true;
      if (n === current.answer) b.classList.add('ok');
      else if (n === i) b.classList.add('no');
    });
    var fb = modal.querySelector('.dsv-fb');
    if (i === -1) fb.innerHTML = '<span>Answer: ' + current.options[current.answer] + '</span>';
    else if (i === current.answer) fb.innerHTML = '<span class="good">Correct.</span>' + (current.why ? ' ' + current.why : '');
    else fb.innerHTML = '<span class="bad">Not quite.</span> The answer is ' + current.options[current.answer] + '.' + (current.why ? ' ' + current.why : '');
    modal.querySelector('.dsv-go').textContent = 'Show the step →';
    modal.querySelector('.dsv-skip').hidden = true;
    modal.querySelector('.dsv-go').focus();
  }

  function proceed() { var go = pending; close(); if (go) go(); }
  function close() { if (modal) modal.hidden = true; pending = null; current = null; }
  function isOpen() { return modal && !modal.hidden; }

  /* ---------- keyboard ---------- */
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (isOpen()) {
      if (/^[1-9]$/.test(k) && !answered) { var n = +k - 1; if (current.options[n] != null) { reveal(n); e.preventDefault(); } }
      else if ((k === 'Enter' || k === 'ArrowRight') && answered) { proceed(); e.preventDefault(); }
      else if (k === 'Escape') { close(); e.preventDefault(); }
      return;
    }
    if (k === 'p' || k === 'P') { if (opts.predict) { prefs.predict = !prefs.predict; save(); applyPrefs(); } return; }
    if (k === 'f' || k === 'F') { prefs.projector = !prefs.projector; save(); applyPrefs(); return; }
    var p = panels[active];
    if (!p) return;
    if (t && t.tagName === 'BUTTON' && (k === ' ' || k === 'Enter')) return;
    if (k === 'ArrowRight' && p.next) { p.next(); e.preventDefault(); }
    else if (k === 'ArrowLeft' && p.prev) { p.prev(); e.preventDefault(); }
    else if (k === ' ' && p.auto) { p.auto(); e.preventDefault(); }
    else if ((k === 'r' || k === 'R') && p.reset) { p.reset(); }
    else if (/^[1-9]$/.test(k) && panels.length > 1) { setActive(+k - 1); }
  });

  /* ---------- helpers for pages ---------- */
  function shuffle(arr, seed) {
    var a = arr.slice(), s = (seed || 1) * 9301 + 49297;
    for (var i = a.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; var j = Math.floor(s / 233280 * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  /* build a question from a correct value and distractors; keeps order stable per seed */
  function choice(prompt, correct, distractors, seed, why) {
    var seen = {}, list = [];
    [correct].concat(distractors).forEach(function (v) { var key = String(v); if (!seen[key]) { seen[key] = 1; list.push(v); } });
    list = list.slice(0, 4);
    var order = shuffle(list, seed);
    return { prompt: prompt, options: order.map(String), answer: order.indexOf(correct), why: why };
  }

  function init(o) {
    opts = Object.assign({ predict: true }, o || {});
    if (document.body) buildBar(); else document.addEventListener('DOMContentLoaded', buildBar);
  }

  return { init: init, register: register, ask: ask, choice: choice, isOpen: isOpen };
})();

</script>
<script>

const STRAT_NAME={chain:'separate chaining',linear:'linear probing',double:'double hashing'};
const HC={col:0,probe:0};
let hashTimer=null;
function hashSim(){
  const k=SC.keys[step], i0=SC.h1(k);
  if(strategy==='chain') return {slot:i0,probes:0,col:table[i0].length>0,home:i0};
  let p=i0,c=0;
  if(strategy==='linear'){ while(table[p].length>0&&c<SC.N){p=(p+1)%SC.N;c++;} }
  else { const s2=SC.h2(k); while(table[p].length>0&&c<SC.N*2){c++;p=((i0+c*s2)%SC.N+SC.N)%SC.N;} }
  return {slot:p,probes:c,col:c>0,home:i0};
}
function hashCnt(){
  let row=document.getElementById('hashCnt');
  if(!row){ row=document.createElement('div'); row.className='dsv-cnt hash-cnt'; row.id='hashCnt';
    document.querySelector('.ctrl-row').insertAdjacentElement('beforebegin',row); }
  row.innerHTML='<span>Keys inserted <b>'+step+'</b></span><span>Collisions <b>'+HC.col+'</b></span>'+(strategy==='chain'?'':'<span>Extra probes <b>'+HC.probe+'</b></span>');
  const pv=document.getElementById('btn-prev'); if(pv) pv.disabled=step===0;
}
const _hNext=next, _hReset=reset;
next=function(){ if(step>=SC.keys.length) return; const s=hashSim(); _hNext(); if(s.col) HC.col++; HC.probe+=s.probes; hashCnt(); };
reset=function(){ HC.col=0; HC.probe=0; hashStop(); _hReset(); hashCnt(); };
function prevStep(){ if(step<=0) return; const k=step-1; reset(); for(let i=0;i<k;i++) next(); if(k===0) hashCnt(); }
function hashQ(){
  if(step>=SC.keys.length) return null;
  const k=SC.keys[step], s=hashSim(), N=SC.N;
  const f=SC.h1Label+(strategy==='double'?', '+SC.h2Label:'');
  const why = strategy==='chain' ? (s.col?'Slot '+s.slot+' already has keys, so '+k+' joins its chain.':'Its home slot '+s.slot+' is empty.')
    : (s.col?'Home slot '+s.home+' is taken, so it probes '+s.probes+' time'+(s.probes>1?'s':'')+' and lands in slot '+s.slot+'.':'Its home slot '+s.slot+' is empty.');
  const q=DSV.choice('Insert <b>'+k+'</b> with '+STRAT_NAME[strategy]+' <span style="white-space:nowrap">('+f+')</span>. Which slot does it end up in?',
    s.slot, [s.home,(s.slot+1)%N,(s.home+1)%N,(s.slot+N-1)%N,(s.home+2)%N], step+strategy.length, why);
  q.options=q.options.map(x=>'Slot '+x); return q;
}
function nextGated(){ if(step>=SC.keys.length) return false; return DSV.ask(hashQ(), ()=>next()); }
function hashStop(){ if(hashTimer){clearInterval(hashTimer);hashTimer=null;} const b=document.getElementById('btn-auto'); if(b) b.textContent='▶ Auto'; }
function toggleAuto(){
  if(hashTimer){ hashStop(); return; }
  document.getElementById('btn-auto').textContent='⏸ Pause';
  hashTimer=setInterval(()=>{ if(step>=SC.keys.length){hashStop();return;} if(nextGated()) hashStop(); },1000);
}
DSV.init({});
DSV.register({el:null,next:nextGated,prev:prevStep,auto:toggleAuto,reset:()=>reset()});
hashCnt();

</script>
